<!-- Root element of PhotoSwipe. Must have class pswp. -->
<div class="pswp" tabindex="-1" role="dialog" aria-hidden="true">
  <!-- Background of PhotoSwipe. 
           It's a separate element as animating opacity is faster than rgba(). -->
  <div class="pswp__bg"></div>
  <!-- Slides wrapper with overflow:hidden. -->
  <div class="pswp__scroll-wrap">
    <!-- Container that holds slides. 
              PhotoSwipe keeps only 3 of them in the DOM to save memory.
              Don't modify these 3 pswp__item elements, data is added later on. -->
    <div class="pswp__container">
      <div class="pswp__item"></div>
      <div class="pswp__item"></div>
      <div class="pswp__item"></div>
    </div>
    <!-- Default (PhotoSwipeUI_Default) interface on top of sliding area. Can be changed. -->
    <div class="pswp__ui pswp__ui--hidden">
      <div class="pswp__top-bar">
        <!--  Controls are self-explanatory. Order can be changed. -->
        <div class="pswp__counter"></div>
        <button class="pswp__button pswp__button--close" title="Close (Esc)"></button>
        <button class="pswp__button pswp__button--share" title="Share"></button>
        <button class="pswp__button pswp__button--fs" title="Toggle fullscreen"></button>
        <button class="pswp__button pswp__button--zoom" title="Zoom in/out"></button>
        <!-- Preloader demo https://codepen.io/dimsemenov/pen/yyBWoR -->
        <!-- element will get class pswp__preloader - active when preloader is running -->
        <div class="pswp__preloader">
          <div class="pswp__preloader__icn">
            <div class="pswp__preloader__cut">
              <div class="pswp__preloader__donut"></div>
            </div>
          </div>
        </div>
      </div>
      <div class="pswp__share-modal pswp__share-modal--hidden pswp__single-tap">
        <div class="pswp__share-tooltip"></div>
      </div>
      <button class="pswp__button pswp__button--arrow--left" title="Previous (arrow left)">
      </button>
      <button class="pswp__button pswp__button--arrow--right" title="Next (arrow right)">
      </button>
      <div class="pswp__caption">
        <div class="pswp__caption__center"></div>
      </div>
    </div>
  </div>
</div>

<script type="text/javascript">
$(window).load(function(){
// external js: isotope.pkgd.js

// init Isotope
var iso = new Isotope(
'.isogrid', 
{
itemSelector: '.element-item',
layoutMode: 'masonry',
masonry: {
    isFitWidth: false,
    gutter: 16
  }
}
);

// filter functions
var filterFns = {
// show if number is greater than 50
numberGreaterThan50: function (itemElem) {
var number = itemElem.querySelector('.number').textContent;
return parseInt(number, 10) > 50;
},
// show if name ends with -ium
ium: function (itemElem) {
var name = itemElem.querySelector('.name').textContent;
return name.match(/ium$/);
}
};

// bind filter button click
var filtersElem = document.querySelector('.filters-button-group');
filtersElem.addEventListener('click', function (event) {
// only work with buttons
if (!matchesSelector(event.target, 'button')) {
return;
}
var filterValue = event.target.getAttribute('data-filter');
// use matching filter function
filterValue = filterFns[filterValue] || filterValue;
iso.arrange({ filter: filterValue });
});

// change w3-purple class on buttons
var buttonGroups = document.querySelectorAll('.button-group');
for (var i = 0, len = buttonGroups.length; i < len; i++) {
var buttonGroup = buttonGroups[i];
radioButtonGroup(buttonGroup);
}

function radioButtonGroup(buttonGroup) {
buttonGroup.addEventListener('click', function (event) {
// only work with buttons
if (!matchesSelector(event.target, 'button')) {
return;
}
buttonGroup.querySelector('.w3-purple').classList.remove('w3-purple');
event.target.classList.add('w3-purple');
});
}});


  // layout Isotope after each image loads
imagesLoaded( grid ).on( 'progress', function() {
  iso.layout();
});
  // layout Isotope after resizing screen
addEventListener('resize', (event) => {
  iso.layout();
});


</script>

<!-- PHOTOSWIPE --> 
<script type="text/javascript">
'use strict';

/* global jQuery, PhotoSwipe, PhotoSwipeUI_Default, console */

(function($) {

// Init empty gallery array
var container = [];

// Loop over gallery items and push it to the array
$('#gallery').find('div').each(function() {
var $link = $(this).find('.gallery-item'),
item = {
src: $link.attr('href'),
w: $link.data('width'),
h: $link.data('height'),
title: $link.data('caption')
};
container.push(item);
});

// Define click event on gallery item
$('.gallery-item').click(function(event) {

// Prevent location change
event.preventDefault();

// Define object and gallery options
var $pswp = $('.pswp')[0],
options = {
index: $(this).parent('div').index(),
bgOpacity: 0.85,
showHideOpacity: true
};

// Initialize PhotoSwipe
var gallery = new PhotoSwipe($pswp, PhotoSwipeUI_Default, container, options);
gallery.init();
});

}(jQuery));
</script>
